<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Baatlo - Anonymous Chat, No Sign-up</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#0f1220;color:#eee;height:100dvh}
.hide{display:none!important}
.center{height:100dvh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:20px;text-align:center}
h1{margin:0;font-size:2.2rem}p{margin:0;color:#9aa}
button,input{font:inherit;border-radius:10px;border:0;padding:12px 16px}
.btn{background:#6c5ce7;color:#fff;cursor:pointer;font-weight:600}.btn:hover{background:#5a4bd1}
input{background:#1c2038;color:#eee;width:100%;max-width:320px;outline:1px solid #2c3158}
.g{display:flex;gap:10px;max-width:320px;width:100%}.g button{flex:1;background:#1c2038;color:#eee;cursor:pointer;outline:1px solid #2c3158}
.g button.on{background:#6c5ce7}
#app{display:flex;height:100dvh}
#side{width:300px;border-right:1px solid #232846;overflow-y:auto;background:#12162a}
#side h3{margin:0;padding:16px;border-bottom:1px solid #232846;font-size:1rem}
.u{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;border-bottom:1px solid #1a1f38}
.u:hover,.u.act{background:#1c2038}
.av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex:none}
.dot{width:9px;height:9px;border-radius:50%;background:#2ecc71;margin-left:auto}.dot.new{background:#ff7675}
#chat{flex:1;display:flex;flex-direction:column;min-width:0}
#head{padding:12px 16px;border-bottom:1px solid #232846;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#head b{flex:1}#head button{background:#232846;color:#eee;padding:6px 10px;font-size:.8rem;cursor:pointer}
#back{display:none}
#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.m{max-width:75%;padding:9px 13px;border-radius:14px;background:#232846;word-wrap:break-word;white-space:pre-wrap}
.m.me{align-self:flex-end;background:#6c5ce7}
#bar{display:flex;gap:8px;padding:12px;border-top:1px solid #232846}#bar input{max-width:none;flex:1}
.empty{margin:auto;color:#789;text-align:center;padding:20px}
@media(max-width:700px){#side{width:100%}#chat{display:none;width:100%}#app.chatting #side{display:none}#app.chatting #chat{display:flex}#back{display:block}}
#toasts{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;flex-direction:column}
.tb,#gbox,#tbox{padding:10px 16px;background:#1c2038;border-bottom:1px solid #232846;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tb button,#gbox button,#tbox button{padding:6px 12px;font-size:.85rem;cursor:pointer;background:#6c5ce7;color:#fff}
#gbox .q,#tbox .q{flex-basis:100%;font-size:1.05rem}
</style></head><body>

<div id="s1" class="center"><h1>💬 Baatlo</h1><p>No sign-up. No phone number. No email.</p>
<button class="btn" onclick="go('s2')">Start Chatting</button></div>

<div id="s2" class="center hide"><h2>Enter your details</h2>
<input id="nick" maxlength="20" placeholder="Nickname (optional)">
<input id="age" type="number" min="18" max="99" placeholder="Age (18+)">
<div class="g"><button id="gm" onclick="pick('male')">Male</button><button id="gf" onclick="pick('female')">Female</button></div>
<p id="err" style="color:#ff7675"></p>
<button class="btn" onclick="join()">Go Online</button>
<p style="font-size:.8rem">18+ only. Please be respectful to everyone.</p></div>

<div id="app" class="hide">
 <div id="side"><h3 id="stitle">Online</h3><div id="list"></div></div>
 <div id="chat"><div id="head"><button id="back" onclick="closeChat()">←</button><b id="who">Select someone</b>
  <button onclick="blk()" id="bb" class="hide">Block</button><button onclick="rep()" id="rb" class="hide">Report</button>
  <button onclick="callBtn()" id="cb" class="hide">📞 Call</button><button onclick="invite()" id="gb" class="hide">🎲 Truth &amp; Dare</button><button onclick="tlInvite()" id="tb" class="hide">🕵️ 2 Truths &amp; 1 Lie</button></div>
  <div id="gbox" class="hide"></div>
  <div id="tbox" class="hide"></div>
  <div id="msgs"><div class="empty">Click on someone who is online to start chatting 👈</div></div>
  <form id="bar" class="hide" onsubmit="send(event)"><input id="txt" maxlength="500" placeholder="Type a message..." autocomplete="off"><button class="btn">Send</button></form>
 </div></div>

<div id="toasts"></div><audio id="ra" autoplay></audio>
<script src="/socket.io/socket.io.js"></script>
<script>
const s=io();let gender=null,users=[],active=null,chats={},unread={};
const $=id=>document.getElementById(id);
const cols=['#e17055','#00b894','#0984e3','#e84393','#fdcb6e','#6c5ce7'];
const col=id=>cols[[...id].reduce((a,c)=>a+c.charCodeAt(0),0)%cols.length];
function go(x){['s1','s2'].forEach(i=>$(i).classList.add('hide'));$(x).classList.remove('hide')}
function pick(g){gender=g;$('gm').classList.toggle('on',g=='male');$('gf').classList.toggle('on',g=='female')}
function join(){
 const age=parseInt($('age').value,10);
 if(!(age>=18))return $('err').textContent='Only 18+ users are allowed.';
 if(!gender)return $('err').textContent='Please select your gender.';
 s.emit('join',{name:$('nick').value,age,gender},r=>{
  if(r.error)return $('err').textContent=r.error;
  $('s2').classList.add('hide');$('app').classList.remove('hide');
  $('stitle').textContent='Online '+(gender=='male'?'Females':'Males');
 });
}
function renderList(){
 const l=$('list');l.innerHTML='';
 if(!users.length){l.innerHTML='<div class="empty">Nobody is online right now. Check back soon or share the link with your friends!</div>';return}
 users.forEach(u=>{
  const d=document.createElement('div');d.className='u'+(u.id===active?' act':'');
  const a=document.createElement('div');a.className='av';a.style.background=col(u.id);a.textContent=u.name[0].toUpperCase();
  const n=document.createElement('div');n.textContent=u.name+', '+u.age;
  const dot=document.createElement('div');dot.className='dot'+(unread[u.id]?' new':'');
  d.append(a,n,dot);d.onclick=()=>open(u.id);l.appendChild(d);
 });
}
function open(id){
 active=id;unread[id]=0;const u=users.find(x=>x.id===id);
 $('who').textContent=u?u.name+', '+u.age:'Offline';
 ['bb','rb','cb','gb','tb'].forEach(i=>$(i).classList.remove('hide'));$('bar').classList.remove('hide');
 $('app').classList.add('chatting');renderList();renderChat();renderGame();renderTL();
}
function closeChat(){$('app').classList.remove('chatting')}
function renderChat(){
 const m=$('msgs');m.innerHTML='';
 (chats[active]||[]).forEach(x=>{const d=document.createElement('div');d.className='m'+(x.me?' me':'');d.textContent=x.text;m.appendChild(d)});
 m.scrollTop=m.scrollHeight;
}
function send(e){
 e.preventDefault();const t=$('txt').value.trim();if(!t||!active)return;
 s.emit('msg',{to:active,text:t});(chats[active]=chats[active]||[]).push({me:true,text:t});
 $('txt').value='';renderChat();
}
function blk(){if(active&&confirm('Block this user?')){s.emit('block',active);active=null;$('who').textContent='Select someone';$('bar').classList.add('hide');$('msgs').innerHTML='';closeChat()}}
function rep(){if(active){s.emit('report',active);alert('Reported. Thank you.')}}
s.on('users',l=>{users=l;if(active&&!users.find(u=>u.id===active))$('who').textContent='Offline';renderList()});
s.on('msg',m=>{(chats[m.from]=chats[m.from]||[]).push({me:false,text:m.text});
 if(active===m.from)renderChat();else{unread[m.from]=1;renderList()}});

const nm=id=>{const u=users.find(x=>x.id===id);return u?u.name:'Someone'};
function banner(key,text,btns){
 unbanner(key);const d=document.createElement('div');d.className='tb';d.id='b-'+key;
 const t=document.createElement('span');t.textContent=text;d.appendChild(t);
 btns.forEach(([l,f])=>{const b=document.createElement('button');b.textContent=l;b.onclick=f;d.appendChild(b)});
 $('toasts').appendChild(d);
}
function unbanner(key){const e=$('b-'+key);if(e)e.remove()}

/* ---------- Voice call (audio only) ---------- */
let pc=null,peer=null,localStream=null,pendOffer=null,pendIce=[];
const rtc=(to,data)=>s.emit('rtc',{to,data});
async function mkpc(id){
 peer=id;
 localStream=await navigator.mediaDevices.getUserMedia({audio:true});
 pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
 localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
 pc.ontrack=e=>{$('ra').srcObject=e.streams[0]};
 pc.onicecandidate=e=>e.candidate&&rtc(id,{t:'ice',c:e.candidate});
 pc.onconnectionstatechange=()=>{if(['failed','closed'].includes(pc.connectionState))endCall(false)};
}
async function callBtn(){
 if(pc)return endCall(true);
 if(!active)return;
 try{
  await mkpc(active);const o=await pc.createOffer();await pc.setLocalDescription(o);
  rtc(active,{t:'offer',sdp:o});
  banner('call','Calling '+nm(active)+'...',[['Cancel',()=>endCall(true)]]);
  $('cb').textContent='📞 Hang up';
 }catch(e){endCall(false);alert('Could not start the call. Please allow microphone access.')}
}
function endCall(send){
 if(send&&peer)rtc(peer,{t:'hangup'});
 if(pc){pc.close();pc=null}
 if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null}
 $('ra').srcObject=null;peer=null;pendOffer=null;pendIce=[];
 $('cb').textContent='📞 Call';unbanner('call');
}
async function acceptCall(){
 const o=pendOffer;pendOffer=null;
 try{
  await mkpc(o.from);await pc.setRemoteDescription(o.sdp);
  pendIce.forEach(c=>pc.addIceCandidate(c));pendIce=[];
  const a=await pc.createAnswer();await pc.setLocalDescription(a);
  rtc(o.from,{t:'answer',sdp:a});
  banner('call','On call with '+nm(o.from),[['Hang up',()=>endCall(true)]]);
  $('cb').textContent='📞 Hang up';
 }catch(e){endCall(true);alert('Could not answer the call. Please allow microphone access.')}
}
async function onRtc(from,d){
 if(d.t==='offer'){
  if(pc||pendOffer)return rtc(from,{t:'busy'});
  pendOffer={from,sdp:d.sdp};
  banner('call',nm(from)+' is calling you 📞',[['Accept',acceptCall],['Decline',()=>{rtc(from,{t:'decline'});pendOffer=null;endCall(false)}]]);
 }else if(d.t==='answer'&&pc&&from===peer){
  await pc.setRemoteDescription(d.sdp);
  pendIce.forEach(c=>pc.addIceCandidate(c));pendIce=[];
  banner('call','On call with '+nm(from),[['Hang up',()=>endCall(true)]]);
 }else if(d.t==='ice'){
  if(pc&&pc.remoteDescription&&from===peer)pc.addIceCandidate(d.c);else pendIce.push(d.c);
 }else if(['hangup','decline','busy'].includes(d.t)){
  if(from===peer||(pendOffer&&pendOffer.from===from)){
   endCall(false);
   if(d.t==='decline')alert('Call declined.');
   if(d.t==='busy')alert('User is busy on another call.');
  }
 }
}
s.on('rtc',m=>onRtc(m.from,m.data));

/* ---------- Truth or Dare ---------- */
let game=null; // {with, turn:'me'|'them', q:null|{kind,text}}
function invite(){
 if(!active)return;
 if(game)return alert('A game is already running.');
 s.emit('game',{to:active,type:'invite'});alert('Invite sent! Waiting for them to accept.');
}
const gsend=(type,kind)=>s.emit('game',{to:game?game.with:active,type,kind});
function renderGame(){
 const g=$('gbox');
 if(!game||game.with!==active){g.classList.add('hide');return}
 g.innerHTML='';g.classList.remove('hide');
 const add=(txt,cls)=>{const d=document.createElement('div');if(cls)d.className=cls;d.textContent=txt;g.appendChild(d)};
 const btn=(l,f)=>{const b=document.createElement('button');b.textContent=l;b.onclick=f;g.appendChild(b)};
 add('🎲 Truth or Dare with '+nm(game.with));
 if(game.q){
  add((game.q.kind==='truth'?'😇 TRUTH: ':'😈 DARE: ')+game.q.text,'q');
  if(game.turn==='them')btn('Done ✔ (my turn to choose)',()=>{gsend('done');gameDone()});
  else add('Waiting for them to complete it in the chat...');
 }else if(game.turn==='me'){
  add('Your turn to choose for them:');
  btn('Truth 😇',()=>gsend('pick','truth'));btn('Dare 😈',()=>gsend('pick','dare'));
 }else add('Waiting for '+nm(game.with)+' to choose Truth or Dare...');
 btn('End game',()=>{gsend('end');game=null;renderGame()});
}
function gameDone(){game.q=null;game.turn=game.turn==='me'?'them':'me';renderGame()}
s.on('game',m=>{
 if(m.type==='invite'){
  banner('game',nm(m.from)+' wants to play Truth or Dare 🎲',[
   ['Play',()=>{s.emit('game',{to:m.from,type:'accept'});game={with:m.from,turn:'them',q:null};unbanner('game');open(m.from)}],
   ['No thanks',()=>{s.emit('game',{to:m.from,type:'decline'});unbanner('game')}]]);
 }else if(m.type==='accept'){game={with:m.from,turn:'me',q:null};open(m.from)}
 else if(m.type==='decline')alert('They declined the game invite.');
 else if(m.type==='q'&&game){game.q={kind:m.kind,text:m.text};renderGame()}
 else if(m.type==='done'&&game)gameDone();
 else if(m.type==='end'&&game){game=null;renderGame();alert('The game was ended.')}
});
s.on('users',l=>{
 if(game&&!l.find(u=>u.id===game.with)){game=null;renderGame()}
 if(peer&&!l.find(u=>u.id===peer))endCall(false);
});

/* ---------- Two Truths and a Lie ---------- */
let tlg=null; // {with, role:'write'|'wait'|'guess'|'result', stmts, result, note}
const tsend=(type,extra)=>s.emit('tl',Object.assign({to:tlg?tlg.with:active,type},extra||{}));
function tlInvite(){
 if(!active)return;
 if(tlg)return alert('A round is already running.');
 s.emit('tl',{to:active,type:'invite'});alert('Invite sent! Waiting for them to accept.');
}
function renderTL(){
 const g=$('tbox');
 if(!tlg||tlg.with!==active){g.classList.add('hide');return}
 g.innerHTML='';g.classList.remove('hide');
 const add=(txt,cls)=>{const d=document.createElement('div');if(cls)d.className=cls;d.textContent=txt;g.appendChild(d)};
 const btn=(l,f)=>{const b=document.createElement('button');b.textContent=l;b.onclick=f;g.appendChild(b)};
 add('🕵️ Two Truths & a Lie with '+nm(tlg.with));
 if(tlg.role==='write'){
  add('Write 2 truths and 1 lie about yourself. Tick the radio button next to your lie:','q');
  const ins=[];let lie=0;
  for(let i=0;i<3;i++){
   const row=document.createElement('div');row.className='q';
   const r=document.createElement('input');r.type='radio';r.name='tlr';r.style.cssText='width:auto;margin-right:8px';
   if(i===0)r.checked=true;r.onchange=()=>{lie=i};
   const t=document.createElement('input');t.maxLength=120;t.placeholder='Statement '+(i+1);t.style.cssText='width:calc(100% - 30px);max-width:none';
   row.append(r,t);g.appendChild(row);ins.push(t);
  }
  btn('Send',()=>{
   const v=ins.map(x=>x.value.trim());
   if(v.some(x=>!x))return alert('Please fill all 3 statements.');
   tsend('set',{stmts:v,lie});tlg.role='wait';tlg.note='Sent! Waiting for them to guess...';renderTL();
  });
 }else if(tlg.role==='guess'){
  add('Which one is the LIE?','q');
  tlg.stmts.forEach((t,i)=>btn((i+1)+'. '+t,()=>{tsend('guess',{guess:i});tlg.role='wait';tlg.note='Guess sent...';renderTL()}));
 }else if(tlg.role==='result'){
  const r=tlg.result;
  add(r.mine?(r.correct?'🎉 They found your lie!':'😎 You fooled them!'):(r.correct?'✅ Correct! You found the lie.':'❌ Wrong! You got fooled.'),'q');
  r.stmts.forEach((t,i)=>add((i===r.lie?'🤥 LIE: ':'✔ TRUTH: ')+t,'q'));
  if(!r.mine)btn('Next round (my turn to write)',()=>{tsend('next');tlg.role='write';tlg.result=null;renderTL()});
  else add('Waiting for them to start the next round...','q');
 }else add(tlg.note||('Waiting for '+nm(tlg.with)+' to write their statements...'),'q');
 btn('End game',()=>{tsend('end');tlg=null;renderTL()});
}
s.on('tl',m=>{
 if(m.type==='invite'){
  banner('tl',nm(m.from)+' wants to play Two Truths & a Lie 🕵️',[
   ['Play',()=>{s.emit('tl',{to:m.from,type:'accept'});tlg={with:m.from,role:'wait'};unbanner('tl');open(m.from)}],
   ['No thanks',()=>{s.emit('tl',{to:m.from,type:'decline'});unbanner('tl')}]]);
 }else if(m.type==='accept'){tlg={with:m.from,role:'write'};open(m.from)}
 else if(m.type==='decline')alert('They declined the invite.');
 else if(m.type==='guess'&&tlg){tlg.role='guess';tlg.stmts=m.stmts;renderTL()}
 else if(m.type==='result'&&tlg){tlg.role='result';tlg.result={stmts:m.stmts,lie:m.lie,correct:m.correct,mine:m.from!==s.id};renderTL()}
 else if(m.type==='next'&&tlg){tlg.role='wait';tlg.note='';tlg.result=null;renderTL()}
 else if(m.type==='end'&&tlg){tlg=null;renderTL();alert('The game was ended.')}
});
s.on('users',l=>{if(tlg&&!l.find(u=>u.id===tlg.with)){tlg=null;renderTL()}});
</script></body></html>
